<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Results - Exams DB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Enhanced Examination Management System</h1>
    </header>
    
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_students.html">View Students</a>
        <a href="add_marks.html">Add Marks</a>
        <a href="view_results.html">View Results</a>
    </nav>
    
    <div class="container">
        <h2>Published Results</h2>
        <div id="message"></div>
        
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Result ID</th>
                    <th>Student Name</th>
                    <th>Subject</th>
                    <th>Total Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be loaded here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const msgBox = document.getElementById('message');
            const tbody = document.querySelector('#resultsTable tbody');

            fetch('http://localhost:3000/api/results')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        msgBox.style.display = 'block';
                        msgBox.className = 'message error';
                        msgBox.textContent = 'Error: ' + data.error;
                    } else {
                        if (data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No results published yet</td></tr>';
                        } else {
                            data.forEach(result => {
                                let gradeColor = result.grade === 'F' ? 'color: red; font-weight: bold;' : 'color: green; font-weight: bold;';
                                const row = `
                                <tr>
  				  <td>${result.result_id}</td>
  				  <td>${result.student_name}</td>
 				  <td>${result.subject_name}</td>
 				  <td>${result.total_marks}</td>
  				  <td>${result.grade}</td>
				</tr>`;
                                tbody.innerHTML += row;
                            });
                        }
                    }
                })
                .catch(error => {
                    msgBox.style.display = 'block';
                    msgBox.className = 'message error';
                    msgBox.textContent = 'Connection failed. Is the server running?';
                });
        });
    </script>
</body>
</html>
